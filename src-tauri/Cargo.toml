[package]
name = "seomi"
version = "0.4.47"
description = "Lightning-fast Native Desktop SEO & Open Graph Auditor"
authors = ["Tomasz Bołoz"]
edition = "2021"
rust-version = "1.90"
autoexamples = false

[lib]
name = "seomi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
test-fixture = []

[[example]]
name = "desktop_e2e"
required-features = ["custom-protocol", "test-fixture"]

[[example]]
name = "function_inventory"
test = true

[[example]]
name = "verify_update_signatures"
test = true

[[example]]
name = "coverage_sources"
test = true

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
syn = { version = "3.0.9", features = ["full"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
minisign-verify = "0.3.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-proxy", "tracing"] }
tauri-plugin-dialog = { version = "2.8.3", default-features = false }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-notification = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
flate2 = "1.1.10"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "json", "query", "form", "cookies", "gzip", "brotli"] }
scraper = "0.29.0"
url = "2.5.8"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
base64 = "0.23.1"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
log = "0.4.34"
env_logger = "0.11.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
mime = "0.3.17"
encoding_rs = "0.8.42"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store"] }
fs2 = "0.4.3"
dunce = "1.0.5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
dns-lookup = "4.0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.5", features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSValue",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKPDFConfiguration",
    "WKSnapshotConfiguration",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
