[package]
name = "seomi"
version = "0.0.4"
description = "Lightning-fast Native Desktop SEO & Open Graph Auditor"
authors = ["Tomasz Bołoz"]
edition = "2021"
rust-version = "1.77.2"
autoexamples = false

[lib]
name = "seomi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[example]]
name = "desktop_e2e"
required-features = ["custom-protocol"]

[[example]]
name = "function_inventory"
test = true

[[example]]
name = "verify_update_signatures"
test = true

[[example]]
name = "coverage_sources"
test = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
minisign-verify = "0.2.5"
tokio = { version = "1.41", features = ["test-util"] }

[dependencies]
tauri = { version = "2", features = ["macos-proxy", "tracing"] }
tauri-plugin-dialog = { version = "2.7.0", default-features = false }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1.25"
flate2 = "1.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli"] }
scraper = "0.26"
url = "2.5"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
mime = "0.3"
encoding_rs = "0.8"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
fs2 = "0.4.3"
dunce = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKPDFConfiguration",
    "WKSnapshotConfiguration",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
