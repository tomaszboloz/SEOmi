name: Test Suite & Security Audit
on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rust:
    name: Rust Backend Unit & Security Tests
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install frontend dependencies for the desktop coverage harness
        run: npm ci
      - name: Build frontend assets for the desktop coverage harness
        run: npm run build
      - name: Install MCP server dependencies for native coverage
        run: npm ci --prefix mcp-server --ignore-scripts
      - name: Build MCP server for native coverage
        run: npm run build --prefix mcp-server
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run required native regression and tool tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  coverage-rust:
    name: Rust production coverage measurement
    needs: [test-rust, test-frontend, desktop-platform-smoke, dependency-security]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install frontend dependencies for the desktop coverage harness
        run: npm ci
      - name: Build frontend assets for the desktop coverage harness
        run: npm run build
      - name: Install MCP server dependencies for native coverage
        run: npm ci --prefix mcp-server --ignore-scripts
      - name: Build MCP server for native coverage
        run: npm run build --prefix mcp-server
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Inventory source boundaries for native coverage
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --example coverage_sources > native-coverage-sources.json
      - name: Run Cargo Test with coverage
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/seomi-native-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo +nightly llvm-cov clean --manifest-path src-tauri/Cargo.toml --workspace
          cargo +nightly llvm-cov --manifest-path src-tauri/Cargo.toml --branch --no-report
          mkdir -p test-results
          SEOMI_E2E_RENDERER=1 cargo +nightly llvm-cov run --manifest-path src-tauri/Cargo.toml --example desktop_e2e --features custom-protocol,test-fixture --branch --no-clean --lcov --output-path coverage-rust.lcov -- test-results/desktop-e2e-coverage.json
          node scripts/validate-desktop-e2e-report.mjs test-results/desktop-e2e-coverage.json
          cargo +nightly llvm-cov run --manifest-path src-tauri/Cargo.toml --bin seomi --features custom-protocol --branch --no-clean -- --seomi-scheduled-headless --seomi-scheduled-project coverage-smoke --seomi-scheduled-id missing-task
          cargo +nightly llvm-cov run --manifest-path src-tauri/Cargo.toml --bin seomi --features custom-protocol --branch --no-clean -- --seomi-audit-queue-headless --seomi-scheduled-project coverage-smoke --seomi-scheduled-id missing-run
          cargo +nightly llvm-cov report --manifest-path src-tauri/Cargo.toml --branch --lcov --output-path coverage-rust.lcov
          cargo +nightly llvm-cov report --manifest-path src-tauri/Cargo.toml --branch --json --output-path coverage-rust.json
          node scripts/native-production-coverage.mjs coverage-rust.lcov native-coverage-sources.json coverage-rust-production.lcov coverage-rust.json
      - name: Upload native coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-coverage
          path: |
            coverage-rust.lcov
            coverage-rust.json
            coverage-rust-production.lcov
            coverage-rust-production.lcov.summary.json
            native-coverage-sources.json
            test-results/desktop-e2e-coverage.json
          retention-days: 14
      - name: Inventory declared native functions using Rust AST
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --example function_inventory > native-function-inventory.json
      - name: Upload native function inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-function-inventory
          path: native-function-inventory.json
          retention-days: 14

  native-coverage-threshold:
    name: Rust production coverage (95% follow-up)
    needs: coverage-rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-coverage
          path: .
      - name: Enforce unchanged production coverage target
        run: node scripts/native-coverage-threshold.mjs coverage-rust-production.lcov.summary.json

  test-frontend:
    name: Frontend TypeScript, i18n & Vitest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify independent product sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-source-policy.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify the canonical application version
        run: npm run version:check
      - name: Enforce the physical source and test line limit
        run: npm run check:loc
      - name: Lint TypeScript and React
        run: npm run lint
      - name: Run required frontend regression tests
        run: npm test
      - name: Typecheck & Production Bundle
        run: npm run build

  coverage-frontend-mcp:
    name: Frontend and MCP coverage (98% follow-up)
    needs: [test-rust, test-frontend, desktop-platform-smoke, dependency-security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest with full frontend coverage
        run: npm run test:coverage:target
      - name: Install MCP coverage dependencies
        run: npm ci --prefix mcp-server --ignore-scripts
      - name: Measure MCP source execution through Node tests
        run: npm run test:coverage:mcp
      - name: Inventory TypeScript public functions and fresh execution evidence
        run: npm run test:inventory
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          if-no-files-found: error
          path: |
            coverage/
            test-results/frontend-coverage-sources.json
            test-results/mcp-coverage-sources.json
            test-results/mcp-runtime-sources.json
            test-results/public-function-inventory.json
          retention-days: 14

  desktop-platform-smoke:
    name: Desktop platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check release scheduling on the desktop platform
        run: npm test -- tests/releaseScheduling.test.ts
      - name: Run full frontend test suite
        run: npm test -- --run --maxWorkers=2
      - name: Run Rust backend tests
        id: desktop-rust-tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Diagnose Windows test harness loader failure
        if: failure() && runner.os == 'Windows' && steps.desktop-rust-tests.outcome == 'failure'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/debug/deps/seomi_lib-*.exe | ForEach-Object {
            ./scripts/diagnose-windows-loader.ps1 -Executable $_.FullName
          }
      - name: Compile Tauri desktop application without bundling
        run: npm run tauri -- build --debug --no-bundle
      - name: Launch actual desktop runtime E2E
        id: desktop-runtime
        env:
          SEOMI_E2E_RENDERER: '1'
        run: npm run test:desktop
      - name: Validate actual desktop renderer evidence
        run: node scripts/validate-desktop-e2e-report.mjs test-results/desktop-e2e.json
      - name: Diagnose Windows loader failure
        if: failure() && runner.os == 'Windows' && steps.desktop-runtime.outcome == 'failure' && hashFiles('test-results/desktop-e2e.json') == ''
        shell: pwsh
        run: ./scripts/diagnose-windows-loader.ps1 -Executable src-tauri/target/debug/examples/desktop_e2e.exe
      - name: Upload desktop runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: test-results/desktop-e2e.json
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: Dependency Vulnerability Scan & SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit all Node dependencies
        run: npm audit --audit-level=high

      - name: Install MCP server dependencies without lifecycle scripts
        run: npm ci --prefix mcp-server --ignore-scripts

      - name: Audit MCP server dependencies
        run: npm audit --prefix mcp-server --audit-level=high

      - name: Build and test MCP server
        run: npm test --prefix mcp-server

      - name: Generate Node SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --spec-version 1.6 --output-file sbom-node.json --output-format json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Rust dependency security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Generate Rust CycloneDX SBOM for all target platforms
        run: cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --target all --override-filename sbom-rust

      - name: Upload dependency reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-sbom-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            sbom-node.json
            src-tauri/sbom-rust.json
