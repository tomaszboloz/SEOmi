name: Multi-Platform Release (macOS & Windows)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-preflight:
    name: Verify release signing credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check updater signing credentials
        id: credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY; release blocked.' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'Updater signing configured. Installers have no Apple Developer ID or Windows Authenticode certificate.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: release-preflight
    if: needs.release-preflight.outputs.ready == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify independent product sources
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -i '\bopen[ -]?seo\b|every-app|openseo\.so' src src-tauri mcp-server public README.md package.json; then
            echo 'Forbidden source branding/reference found in product files.' >&2
            exit 1
          fi
          if git ls-files | rg -n -i '(^|/)(PRD|GAP|PARITY_MATRIX|MATRIX|AGENTS|CLAUDE|GEMINI|COPILOT|AI_NOTES|AI_CONTEXT|AI_PLAN)([^/]*$|/)' ; then
            echo 'Planning or AI instruction files must not be tracked.' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: 'SEOmi v__VERSION__'
          releaseBody: |
            SEOmi desktop release for macOS and Windows.

            Update packages are signed with the SEOmi Tauri updater key. Installers do not carry Apple Developer ID/notarization or Windows Authenticode certificates; the operating system may display security warnings.

            ### Thanks
            Thank you @RafalSzy for the regression-testing feedback, crawler reports, hybrid rendering work and semantic term grouping contributions.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify every generated updater signature
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --features custom-protocol --example verify_update_signatures -- src-tauri/target

  publish-release:
    name: Publish verified release
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft after platform verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
