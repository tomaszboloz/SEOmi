name: Multi-Platform Release (macOS & Windows)
on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Resolve release tag and verify signing credentials
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: read
      security-events: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      ready: ${{ steps.credentials.outputs.ready }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release tag from the application version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            expected_tag="v${version}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Pushed tag $GITHUB_REF_NAME does not match expected version tag $expected_tag." >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              publish=false
              echo "Tag ${tag} already exists; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            else
              publish=true
              echo "Tag ${tag} is new; the release publishes it automatically." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          node scripts/release-ci-gate-tag.mjs --preflight

      - name: Check updater signing credentials
        id: credentials
        if: steps.resolve.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY; release blocked.' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'Updater signing configured. Installers have no Apple Developer ID or Windows Authenticode certificate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for required CI checks for the exact release SHA
        if: steps.resolve.outputs.publish == 'true' && steps.credentials.outputs.ready == 'true'
        timeout-minutes: 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_CI_TIMEOUT_MS: '2700000'
          RELEASE_CI_POLL_MS: '30000'
        run: node scripts/release-ci-gate.mjs

      - name: Create or find shared draft release
        id: draft
        if: steps.resolve.outputs.publish == 'true' && steps.credentials.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/release-ci-gate-tag.mjs --create-draft

  release:
    needs: release-preflight
    if: needs.release-preflight.outputs.publish == 'true' && needs.release-preflight.outputs.ready == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify independent product sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-source-policy.mjs

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Prepare verified release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: node scripts/release-notes.mjs

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release-preflight.outputs.release_id }}
          tagName: ${{ needs.release-preflight.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'SEOmi v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify every generated updater signature
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --features custom-protocol --example verify_update_signatures -- src-tauri/target

      - name: Generate platform updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: node scripts/release-ci-gate-manifest.mjs --generate "${{ matrix.platform }}"

      - name: Upload platform updater manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-manifest-${{ matrix.platform }}
          path: updater-manifest-${{ matrix.platform }}.json
          retention-days: 1

  publish-release:
    name: Publish verified release
    needs: [release-preflight, release]
    if: needs.release-preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Recheck required CI checks for the exact release SHA
        timeout-minutes: 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_CI_TIMEOUT_MS: '2700000'
          RELEASE_CI_POLL_MS: '30000'
        run: node scripts/release-ci-gate.mjs

      - name: Verify release tag remains on the exact version commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: node scripts/release-ci-gate-tag.mjs --ensure-tag-ref

      - name: Download platform updater manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: updater-manifest-*
          merge-multiple: true
          path: updater-manifests

      - name: Consolidate updater manifests and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-preflight.outputs.release_id }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: node scripts/release-ci-gate-manifest.mjs --consolidate --dir updater-manifests

      - name: Install dependencies for Node SBOM
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX Node SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --spec-version 1.6 --output-file sbom-node.json --output-format json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Generate CycloneDX Rust SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --target all --override-filename sbom-rust
          cp src-tauri/sbom-rust.json sbom-rust.json

      - name: Prepare release provenance, checksums and verify artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-preflight.outputs.release_id }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: node scripts/release-ci-gate-provenance.mjs --prepare-provenance

      - name: Attest build provenance for verified release subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Validate 3-platform assets and publish shared draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ needs.release-preflight.outputs.release_id }}
        run: node scripts/release-ci-gate-tag.mjs --publish-draft

      - name: Verify published release tag points to the exact release SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          object_type="$(gh api "$ref" --jq '.object.type')"
          tag_sha="$(gh api "$ref" --jq '.object.sha')"
          if [[ "$object_type" == 'tag' ]]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          [[ "$tag_sha" == "$RELEASE_COMMIT_SHA" ]] || {
            echo "Release tag $RELEASE_TAG points to $tag_sha, expected $RELEASE_COMMIT_SHA." >&2
            exit 1
          }
          node scripts/release-ci-gate-tag.mjs --verify
