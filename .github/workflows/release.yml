name: Multi-Platform Release (macOS & Windows)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Resolve release tag and verify signing credentials
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release tag from the application version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              publish=false
              echo "Tag ${tag} already exists; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            else
              publish=true
              echo "Tag ${tag} is new; the release publishes it automatically." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Check updater signing credentials
        id: credentials
        if: steps.resolve.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY; release blocked.' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'Updater signing configured. Installers have no Apple Developer ID or Windows Authenticode certificate.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: release-preflight
    if: needs.release-preflight.outputs.publish == 'true' && needs.release-preflight.outputs.ready == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify independent product sources
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -i '\bopen[ -]?seo\b|every-app|openseo\.so' src src-tauri mcp-server public README.md package.json; then
            echo 'Forbidden source branding/reference found in product files.' >&2
            exit 1
          fi
          if git ls-files | rg -n -i '(^|/)(PRD|GAP|PARITY_MATRIX|MATRIX|AGENTS|CLAUDE|GEMINI|COPILOT|AI_NOTES|AI_CONTEXT|AI_PLAN)([^/]*$|/)' ; then
            echo 'Planning or AI instruction files must not be tracked.' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Prepare verified release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: node scripts/release-notes.mjs

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-preflight.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'SEOmi v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify every generated updater signature
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --features custom-protocol --example verify_update_signatures -- src-tauri/target

  publish-release:
    name: Publish verified release
    needs: [release-preflight, release]
    if: needs.release-preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft after platform verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-preflight.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
