name: Multi-Platform Release (macOS & Windows)
on:
  push:
    tags:
      - 'v*'

jobs:
  release-preflight:
    name: Verify release signing credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check platform signing credentials
        id: credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
            WINDOWS_CERTIFICATE
            WINDOWS_CERTIFICATE_PASSWORD
            WINDOWS_CERTIFICATE_THUMBPRINT
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required release secret: %s\n' "$name" >&2
              missing=1
            fi
          done
          if (( missing )); then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Release not published'
              echo
              echo 'Signing credentials are not configured. No unsigned or unverifiable desktop artifact will be published.'
              echo 'Configure the repository Actions secrets when an official macOS and Windows release is ready.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'All release signing credentials are configured.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: release-preflight
    if: needs.release-preflight.outputs.ready == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify independent product sources
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -i '\bopen[ -]?seo\b|every-app|openseo\.so' src src-tauri mcp-server public README.md package.json; then
            echo 'Forbidden source branding/reference found in product files.' >&2
            exit 1
          fi
          if git ls-files | rg -n -i '(^|/)(PRD|GAP|PARITY_MATRIX|MATRIX|AGENTS|CLAUDE|GEMINI|COPILOT|AI_NOTES|AI_CONTEXT|AI_PLAN)([^/]*$|/)' ; then
            echo 'Planning or AI instruction files must not be tracked.' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'seomi-code-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          certutil.exe -f -p $env:WINDOWS_CERTIFICATE_PASSWORD -importPFX My $certificatePath NoRoot
          Remove-Item -Force $certificatePath

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: https://timestamp.digicert.com
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SEOmi v__VERSION__'
          releaseBody: 'SEOmi desktop release for macOS and Windows.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target -type d -path '*/bundle/macos/*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo 'No macOS .app artifact was produced.' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          dmg="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo 'No macOS DMG artifact was produced.' >&2
            exit 1
          fi
          xcrun stapler validate "$dmg"

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $artifacts = Get-ChildItem -Path 'src-tauri/target' -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') }
          if (-not $artifacts) { throw 'No Windows installer or executable artifacts were produced.' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature ($($signature.Status)): $($artifact.FullName)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected Authenticode certificate: $($artifact.FullName)"
            }
          }

  publish-release:
    name: Publish verified release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft after platform verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
