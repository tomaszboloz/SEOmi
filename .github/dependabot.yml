version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Tauri JS and Rust crates must move to a new major together in a planned
    # release PR; a lone Dependabot major bump breaks the CLI/runtime match.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mcp-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
