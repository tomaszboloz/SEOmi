name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: checkboxes
    id: routing
    attributes:
      label: Before you file
      options:
        - label: This is not a security vulnerability. Vulnerabilities go to private Security Advisories.
          required: true
        - label: I removed API keys, tokens, passwords and private project data from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: SEOmi version or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and version, display language, install type.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs or screenshots. Remove API keys, tokens and private URLs first.
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      description: Which screens, modules or platforms are affected, and what check shows the fix works.
