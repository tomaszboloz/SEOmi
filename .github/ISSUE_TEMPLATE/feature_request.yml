name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and out of scope
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks that show the work is done.
    validations:
      required: true
